name: Build Debug APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and Release github debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned NDK, CMake, and build tools
        run: |
          for attempt in 1 2 3; do
            sdkmanager "ndk;29.0.14206865" "cmake;3.22.1" "platform-tools" "platforms;android-36" "build-tools;36.0.0" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-headunit-github-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0-revive
          name: "Open Headunit v4.0.0 (Revive Edition)"
          body: |
            ## Open Headunit - Turnkey Edition for Revive MyDroid
            
            Automated build pre-configured with optimal low-RAM defaults for turning old Android devices into dedicated Android Auto headunits:
            
            - **Onboarding Bypassed**: Opens directly to main screen without manual wizard navigation.
            - **Resolution**: 720p (optimal for low-RAM / budget receivers).
            - **Frame Rate**: 30 FPS.
            - **Video Codec**: Hardware H.264.
            - **Bandwidth Profile**: 2.4 GHz link profile cap enabled.
            - **Connection**: Native AA (Wi-Fi Direct) + USB auto-connect enabled.
            - **Audio Routing**: Audio sink disabled on receiver (sound stays on phone / car Bluetooth).
            - **Launcher / Kiosk**: `CarLauncherAlias` enabled by default for Home launcher replacement.
          files: app/build/outputs/apk/github/debug/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
